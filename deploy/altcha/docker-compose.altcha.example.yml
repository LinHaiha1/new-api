services:
  newapi:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      SQL_DSN: "${SQL_DSN:?set SQL_DSN}"
      REDIS_CONN_STRING: "${REDIS_CONN_STRING:-}"
    networks:
      - newapi-altcha

  newapi-altcha-gate:
    build:
      context: ./gate
    restart: unless-stopped
    environment:
      ALTCHA_HMAC_SECRET: "${ALTCHA_HMAC_SECRET:?set ALTCHA_HMAC_SECRET}"
      COOKIE_SIGNING_SECRET: "${ALTCHA_COOKIE_SECRET:?set ALTCHA_COOKIE_SECRET}"
      COOKIE_SECURE: "${ALTCHA_COOKIE_SECURE:-true}"
      COOKIE_TTL_SECONDS: "${ALTCHA_COOKIE_TTL_SECONDS:-300}"
      CHALLENGE_TTL_SECONDS: "${ALTCHA_CHALLENGE_TTL_SECONDS:-120}"
      ALTCHA_MAX_NUMBER: "${ALTCHA_MAX_NUMBER:-100000}"
      LISTEN_ADDRESS: ":8080"
    healthcheck:
      test: ["CMD", "/altcha-gate", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - newapi-altcha

  newapi-auth-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NEWAPI_PUBLIC_PORT:-13333}:80"
    volumes:
      - ./nginx-altcha.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      newapi:
        condition: service_started
      newapi-altcha-gate:
        condition: service_healthy
    networks:
      - newapi-altcha

networks:
  newapi-altcha:
    driver: bridge
