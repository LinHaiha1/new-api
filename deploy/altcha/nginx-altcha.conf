server {
    listen 80;
    server_name _;
    absolute_redirect off;

    client_max_body_size 100m;

    location = /auth-gate {
        auth_request off;
        return 302 /auth-gate/verify;
    }

    location ^~ /auth-gate/ {
        auth_request off;
        proxy_pass http://newapi-altcha-gate:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /__altcha_auth {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass http://newapi-altcha-gate:8080/auth;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @altcha-page-denied {
        add_header Cache-Control "no-store" always;
        return 302 /auth-gate/verify?return=$uri&aff=$arg_aff;
    }

    location @altcha-api-denied {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"success":false,"message":"请先在注册页面完成人机验证"}';
    }

    location ~ ^/(register|sign-up)/?$ {
        auth_request /__altcha_auth;
        error_page 401 = @altcha-page-denied;
        proxy_pass http://newapi:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/user/register/?$ {
        auth_request /__altcha_auth;
        error_page 401 = @altcha-api-denied;
        proxy_pass http://newapi:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://newapi:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
